[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short -m "not real_harness"
filterwarnings =
    ignore::DeprecationWarning
markers =
    real_harness: 需要真实 Agent CLI 与本机有效登录凭据的测试（会消耗订阅配额）。
        默认被 addopts 的 -m "not real_harness" 排除，普通 CI 不会跑到。
        显式运行：pytest -m real_harness
    semantic_model: 需要本机已备好语义运行时（独立 ML venv + BGE-M3 权重）。
        环境变量 MEMORY_EMBEDDING_INTERPRETER / MEMORY_EMBEDDING_MODEL_PATH
        未配置或权重缺失时自动 skip，不算失败。
